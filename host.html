<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jersey Challenge Host</title><style>body{font-family:system-ui;max-width:600px;margin:40px auto;padding:20px}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #bbb}button{background:#111;color:#fff;border:0;font-weight:700}p{color:#666}.row{display:flex;gap:8px}.row input{flex:1}</style></head><body><h1>🏈 Create Jersey Challenge</h1><p>Enter a short game code and title. This page uses the same Firebase configuration as the main app.</p><div class="row"><input id="code" value="LONDON26" maxlength="12"><input id="title" value="London 2026"></div><br><button id="create">Create Game</button><p id="out"></p><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";import{getDatabase,ref,set,get}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";import config from"./firebase-config.js";const app=initializeApp(config),db=getDatabase(app),auth=getAuth(app);document.getElementById("create").onclick=async()=>{const code=document.getElementById("code").value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"");const title=document.getElementById("title").value.trim();const out=document.getElementById("out");if(!code){out.textContent="Enter a code.";return}try{await signInAnonymously(auth);const r=ref(db,"games/"+code);if((await get(r)).exists()){out.textContent="That code already exists. Choose another.";return}await set(r,{title,createdAt:Date.now(),players:{}});out.textContent="Created! Share the main app URL and game code "+code+"."; }catch(e){out.textContent="Error: "+e.message}};</script></body></html>
